project:
  type: website
  resources:
    - js/*.js
    # agda
    - teaching/**/lectures/*.html
    - teaching/**/lectures/Agda.css
    - teaching/**/_agda/**/*.lagda.md
  pre-render: scripts/agda.sh
  preview:
    port: 7771
    browser: false

execute:
  freeze: auto
  cache: true

website:
  title: "Vikraman's site"
  site-url: https://vikraman.org
  description: "Vikraman's personal website"
  favicon: favicon.svg
  # nav bar
  navbar:
    left:
      - now/index.qmd
      - papers/index.qmd
      - talks/index.qmd
      - notes/index.qmd
      - projects/index.qmd
      - teaching/index.qmd
      - misc/index.qmd
  # course sidebars
  sidebar:
    - id: cs410
      title: CS410
      contents:
        - teaching/cs410/index.qmd
        - section: Spring 2027
          contents:
            - teaching/cs410/sp27/index.qmd
            - teaching/cs410/sp27/lectures/CS410.Prelude.md
            - section: Lectures
              contents:
                - teaching/cs410/sp27/lectures/CS410.Lec01.md
                - teaching/cs410/sp27/lectures/CS410.Lec02.md
                - teaching/cs410/sp27/lectures/CS410.Lec03.md
                - teaching/cs410/sp27/lectures/CS410.Lec04.md
                - teaching/cs410/sp27/lectures/CS410.Lec05.md
                - teaching/cs410/sp27/lectures/CS410.Lec06.md
                - teaching/cs410/sp27/lectures/CS410.Lec07.md
                - teaching/cs410/sp27/lectures/CS410.Lec08.md
                - teaching/cs410/sp27/lectures/CS410.Lec09.md
                - teaching/cs410/sp27/lectures/CS410.Lec10.md
                - teaching/cs410/sp27/lectures/CS410.Lec11.md
                - teaching/cs410/sp27/lectures/CS410.Lec12.md
                - teaching/cs410/sp27/lectures/CS410.Lec13.md
                - teaching/cs410/sp27/lectures/CS410.Lec14.md
                - teaching/cs410/sp27/lectures/CS410.Lec15.md
                - teaching/cs410/sp27/lectures/CS410.Lec16.md
                - teaching/cs410/sp27/lectures/CS410.Lec17.md
                - teaching/cs410/sp27/lectures/CS410.Lec18.md
                - teaching/cs410/sp27/lectures/CS410.Lec19.md
                - teaching/cs410/sp27/lectures/CS410.Lec20.md
                - teaching/cs410/sp27/lectures/CS410.Lec21.md
            - section: Exercises
              contents:
                - teaching/cs410/sp27/lectures/CS410.Ex01.md
                - teaching/cs410/sp27/lectures/CS410.Sol01.md
  # search bar
  search:
    location: navbar
    type: overlay
    keyboard-shortcut: ["?", "H"]
  # navigation
  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  # source repo
  repo-url: https://github.com/vikraman/site
  repo-actions: [source, issue]
  # footer
  page-footer:
    right: "[Site](https://github.com/vikraman/site) built using [Quarto](https://quarto.org)"

format:
  html:
    # styling
    theme:
      light: theme/theme-light.scss
      dark: theme/theme-dark.scss
    respect-user-color-scheme: true
    # layout
    page-layout: full
    grid:
      sidebar-width: 300px
      body-width: 800px
      margin-width: 450px
    title-block-banner: true
    toc: true
    anchor-sections: true
    smooth-scroll: true
    # math
    include-in-header:
      text: |
        <script>MathJax = { output: { font: 'mathjax-pagella' } };</script>
        <script src="/js/cde.js"></script>
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
    # external links
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/vikraman\.org\/'
    # quarto version
    quarto-required: ">= 1.9"
