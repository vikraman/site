on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 */6 * *"
  workflow_dispatch:

name: Render and Deploy

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Create Git LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .git/lfs-hashes.txt

      - name: Restore Git LFS object cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfsdata-v1-${{ hashFiles('.git/lfs-hashes.txt') }}
          restore-keys: |
            ${{ runner.os }}-lfsdata-v1-
            ${{ runner.os }}-lfsdata

      - name: Fetch any needed Git LFS objects and prune extraneous ones
        run: git lfs fetch --prune

      - name: Check out Git LFS content
        run: git lfs checkout

      - name: Setup TeX Live
        uses: zauguin/install-texlive@v4.4.0
        with:
          packages: scheme-full
          texlive_version: 2025

      - name: Set up Agda
        uses: agda/agda-setup-action@v1
        with:
          agda-version: "2.9.0-rc2"

      - name: Restore Agda interface cache
        uses: actions/cache@v6
        with:
          path: teaching/**/_agda/_build
          key: ${{ runner.os }}-agda-v1-${{ hashFiles('teaching/**/*.agda', 'teaching/**/*.lagda.md', 'teaching/**/*.agda-lib') }}
          restore-keys: |
            ${{ runner.os }}-agda-v1-

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy to web server
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: _site/
          remote_path: ${{ secrets.REMOTE_PATH }}
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_port: ${{ secrets.REMOTE_PORT }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.REMOTE_KEY }}

      - name: Purge Cloudflare cache
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
